<section id="faq" class="py-32 px-6 bg-surface-container text-on-surface">
  <div class="max-w-3xl mx-auto">

    <div class="text-center mb-20">
      <span class="section-label">Dudas</span>
      <h2 class="text-5xl md:text-7xl font-display text-on-surface">Preguntas Frecuentes</h2>
    </div>

    <div class="space-y-3">
      @for (faq of faqs; track i; let i = $index) {
        <div class="card overflow-hidden bg-white">
          <button
            (click)="toggle(i)"
            class="w-full p-6 flex items-center justify-between text-left hover:bg-primary-hover transition-colors">
            <span class="font-medium text-on-surface">{{ faq.pregunta }}</span>
            <span
              class="material-symbols-outlined text-primary transition-transform duration-500"
              [class.rotate-180]="openIndex === i">
              expand_more
            </span>
          </button>
          <div
            class="overflow-hidden transition-all duration-500 ease-in-out"
            [style.maxHeight]="openIndex === i ? '500px' : '0px'"
            [style.opacity]="openIndex === i ? '1' : '0'">
            <div class="p-6 pt-0 text-on-surface-variant leading-relaxed border-t border-gray-100">
              {{ faq.respuesta }}
            </div>
          </div>
        </div>
      }
    </div>

  </div>
</section>
