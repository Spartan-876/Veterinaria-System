<section id="reviews" class="bg-surface-container py-32 px-6 text-on-surface">
  <div class="max-w-7xl mx-auto">

    <div class="text-center mb-20">
      <span class="section-label">Comunidad</span>
      <h2 class="text-5xl md:text-7xl font-display text-on-surface">Lo que dicen de Nosotros</h2>
    </div>

    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
      @for (re of revs; track i; let i = $index) {
        <div
          class="card card-hover p-6 bg-white flex flex-col">

          <div class="flex gap-0.5 mb-3 text-tertiary">
            @for (s of [1,2,3,4,5]; track s) {
              <span class="material-symbols-outlined text-base">star</span>
            }
          </div>
          <div class="w-8 h-0.5 bg-primary/20 rounded-full mb-3"></div>
          <p class="text-sm text-on-surface-variant leading-relaxed mb-6">{{ re.descripcion }}</p>

          <div class="flex items-center gap-3 border-t border-outline-variant pt-5 mt-auto">
            <div
              class="w-10 h-10 rounded-full bg-primary-container flex items-center justify-center font-mono text-sm text-primary-dark font-bold">
              {{ re.usuario.charAt(0).toUpperCase() }}
            </div>
            <div>
              <h4 class="text-sm font-semibold text-on-surface">{{ re.usuario }}</h4>
              <p class="text-xs text-on-surface-variant">{{ re.fecha }}</p>
            </div>
          </div>
        </div>
      }
    </div>

  </div>
</section>
